<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kimawa — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --burgundy: #6B2737;
      --burgundy-dark: #4e1c27;
      --cream: #faf8f5;
      --muted: #a09080;
      --border: #e8e0d8;
      --text: #1a0a0d;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background-color: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Layout ── */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    /* ── Wordmark ── */
    .wordmark {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--burgundy);
      margin-bottom: 80px;
    }

    /* ── Hero copy ── */
    .headline {
      font-size: clamp(48px, 8vw, 72px);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -1px;
      color: var(--text);
      margin-bottom: 28px;
    }

    .headline em {
      font-style: italic;
      color: var(--burgundy);
    }

    .tagline {
      font-size: clamp(15px, 2.5vw, 17px);
      font-weight: 300;
      line-height: 1.7;
      color: #4a3a3f;
      max-width: 420px;
      margin-bottom: 16px;
    }

    .sub {
      font-size: 14px;
      font-weight: 300;
      font-style: italic;
      color: var(--muted);
      margin-bottom: 56px;
    }

    /* ── Divider ── */
    .rule {
      width: 40px;
      height: 0.5px;
      background-color: var(--burgundy);
      opacity: 0.4;
      margin-bottom: 48px;
    }

    /* ── Form ── */
    .form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input {
      width: 100%;
      background: #fff;
      border: 0.5px solid var(--border);
      border-radius: 0;
      padding: 14px 16px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 16px;
      font-weight: 300;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    input::placeholder {
      color: #c8b8bc;
    }

    input:focus {
      border-color: var(--burgundy);
    }

    .btn {
      margin-top: 6px;
      width: 100%;
      background-color: var(--burgundy);
      color: #fff;
      border: none;
      border-radius: 0;
      padding: 16px 32px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .btn:hover {
      background-color: var(--burgundy-dark);
    }

    .btn:active {
      background-color: #3a1520;
    }

    /* ── Thank you state ── */
    .thankyou {
      display: none;
    }

    .thankyou-line {
      width: 32px;
      height: 0.5px;
      background-color: var(--burgundy);
      opacity: 0.5;
      margin-bottom: 28px;
    }

    .thankyou-msg {
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 300;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .thankyou-sub {
      font-size: 14px;
      font-style: italic;
      font-weight: 300;
      color: var(--muted);
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .page {
        justify-content: flex-start;
        padding: 48px 20px 40px;
      }

      .wordmark {
        margin-bottom: 56px;
      }

      .sub {
        margin-bottom: 44px;
      }
    }
  </style>
</head>
<body>

  <main class="page">
    <div class="container">

      <p class="wordmark">Kimawa</p>

      <h1 class="headline">
        Beauty,<br />
        <em>reimagined.</em>
      </h1>

      <p class="tagline">
        The AI-powered booking platform for beauty and wellness professionals across Zambia.
      </p>

      <p class="sub">Something beautiful is coming. Be the first to know.</p>

      <div class="rule"></div>

      <!-- Waitlist form -->
      <form class="form" id="waitlist-form" novalidate>
        <div class="field">
          <label for="full-name">Full Name</label>
          <input
            type="text"
            id="full-name"
            name="full_name"
            placeholder="Your full name"
            autocomplete="name"
            required
          />
        </div>
        <div class="field">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+260 9X XXX XXXX"
            autocomplete="tel"
            required
          />
        </div>
        <button type="submit" class="btn">Join the Waitlist</button>
      </form>

      <!-- Thank you state -->
      <div class="thankyou" id="thankyou">
        <div class="thankyou-line"></div>
        <p class="thankyou-msg">You're on the list.</p>
        <p class="thankyou-sub">We'll be in touch.</p>
      </div>

    </div>
  </main>

  <footer>
    &copy; 2026 Kimawa &nbsp;&middot;&nbsp; Lusaka, Zambia
  </footer>

  <script>
    document.getElementById('waitlist-form').addEventListener('submit', function (e) {
      e.preventDefault();

      var name  = document.getElementById('full-name').value.trim();
      var phone = document.getElementById('phone').value.trim();

      if (!name || !phone) return;

      this.style.display = 'none';
      document.getElementById('thankyou').style.display = 'block';
    });
  </script>

</body>
</html>
