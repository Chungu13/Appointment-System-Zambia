<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kimawa — Taking a short pause</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --primary: #3B2A1E;
    --primary-container: #E5D5C0;
    --cream: #FBF7F1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background-color: var(--primary);
    color: var(--cream);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }

  .card {
    max-width: 460px;
    width: 100%;
    text-align: center;
  }

  .logo {
    width: 56px;
    height: 56px;
    margin: 0 auto 32px;
    display: block;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(30px, 6vw, 40px);
    line-height: 1.2;
    color: #ffffff;
    margin: 0 0 20px;
    letter-spacing: 0.2px;
  }

  p {
    font-size: 15px;
    line-height: 1.7;
    color: var(--primary-container);
    margin: 0 0 16px;
  }

  @media (max-width: 420px) {
    .logo { width: 46px; height: 46px; margin-bottom: 24px; }
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/kimawalogo.svg" alt="Kimawa" onerror="this.style.display='none'" />
    <h1>Kimawa is taking a short pause.</h1>
    <p>We're stepping back to make some meaningful improvements behind the scenes.</p>
    <p>Thank you for your patience and for believing in what we're building. 🤍</p>
  </div>
</body>
</html>
